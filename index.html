<!doctype html>
<html lang="bn">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>মিস্ত্রি খুঁজুন</title>

        <style>
            body {
                font-family: sans-serif;
                background: #f4f4f9;
                padding: 15px;
            }
            .card {
                background: #fff;
                padding: 15px;
                border-radius: 8px;
                margin-bottom: 10px;
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            }
            .call-btn {
                background: #28a745;
                color: white;
                padding: 10px 15px;
                border: none;
                border-radius: 5px;
                text-decoration: none;
                display: inline-block;
                font-weight: bold;
            }
        </style>
    </head>
    <body>
        <h2>ইলেকট্রিশিয়ান ও কার মিস্ত্রি সার্ভিস</h2>

        <div class="card">
            <h3>রহিম মিস্ত্রি</h3>
            <p>ক্যাটাগরি: কার মিস্ত্রি</p>
            <p>রেটিং: ⭐ 4.8</p>
            <a href="tel:01700000000" class="call-btn">📞 সরাসরি কল দিন</a>
        </div>
    </body>
</html>
